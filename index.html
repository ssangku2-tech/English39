<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1A2B4C">
<title>One More English</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --navy:#1A2B4C; --indigo:#2a4374;
  --orange:#FF8C00; --orange-d:#e67e00; --green:#2ECC71;
  --bg:#F8F9FA; --surface:#ffffff; --surface2:#f1f3f6;
  --ink:#1A2B4C; --ink2:#5a6b85; --ink3:#9aa6ba;
  --line:#e6e9ef; --shadow:0 6px 22px -8px rgba(26,43,76,.18);
  --head:'Poppins',sans-serif; --body:'Pretendard',sans-serif;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bot:env(safe-area-inset-bottom,0px);
}
[data-theme=dark]{
  --navy:#0e1830; --bg:#0b1426; --surface:#14213d; --surface2:#1b2b4d;
  --ink:#eef2f8; --ink2:#a7b4cc; --ink3:#6d7d9c;
  --line:#243353; --shadow:0 8px 28px -10px rgba(0,0,0,.6);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);
  overflow:hidden;position:fixed;width:100%;transition:background .3s}
#app{height:100%;display:flex;flex-direction:column;position:relative}

header{background:var(--navy);color:#fff;flex-shrink:0;position:relative;
  padding:calc(var(--safe-top) + 16px) 20px 18px;
  border-radius:0 0 22px 22px;box-shadow:var(--shadow);z-index:5}
.brand-row{display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;flex-shrink:0;border-radius:9px;object-fit:cover}
.brand-txt .name{font-family:var(--head);font-weight:700;font-size:18px;letter-spacing:-.3px;line-height:1}
.brand-txt .slogan{font-family:var(--head);font-weight:400;font-style:italic;
  font-size:10.5px;color:#fff9;margin-top:3px;letter-spacing:.2px}
.top-actions{display:flex;gap:8px;align-items:center}
.streak{display:flex;align-items:center;gap:4px;background:#ffffff1a;
  border:1px solid #ffffff26;padding:6px 11px;border-radius:30px;font-size:12.5px;
  font-weight:600;font-family:var(--head)}
.streak .fire{font-size:14px}
.icon-btn{width:34px;height:34px;border-radius:50%;background:#ffffff1a;border:none;
  display:flex;align-items:center;justify-content:center;color:#fff}
.icon-btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8}
.date-line{margin-top:14px;display:flex;align-items:baseline;gap:8px}
.date-caret{align-self:center;margin-left:2px;flex-shrink:0}
.jump-list{margin-top:14px}
.jump-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  background:var(--surface);border:1px solid var(--line);border-radius:13px;
  padding:14px;margin-bottom:9px;font-family:var(--body);font-size:15px;color:var(--ink);transition:.15s}
.jump-item:active{background:var(--surface2)}
.jump-item.cur{border-color:var(--orange);background:var(--surface2)}
.jump-item .jnum{flex-shrink:0;width:26px;height:26px;border-radius:8px;background:var(--surface2);
  color:var(--ink3);font-family:var(--head);font-weight:600;font-size:12px;
  display:flex;align-items:center;justify-content:center}
.jump-item.cur .jnum{background:var(--orange);color:#fff}
.jump-item .jbody{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jump-item .jbody b{font-family:var(--head);font-weight:600}

/* 하단 고정 추가 버튼 */
.fab-float{position:absolute;right:18px;bottom:calc(var(--safe-bot) + 84px);z-index:20;
  width:56px;height:56px;border-radius:50%;border:none;background:var(--orange);color:#fff;
  font-family:var(--head);font-size:30px;font-weight:400;line-height:1;
  box-shadow:0 8px 22px -6px rgba(255,140,0,.6);transition:.15s;display:none;
  align-items:center;justify-content:center;padding-bottom:3px}
.fab-float.show{display:flex}
.fab-float:active{transform:scale(.9);background:var(--orange-d)}
.date-big{font-family:var(--head);font-weight:600;font-size:22px;letter-spacing:-.4px}
.date-sub{color:#fff9;font-size:12.5px}
.progress{height:5px;background:#ffffff26;border-radius:10px;margin-top:13px;overflow:hidden}
.progress > i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--orange),#ffb347);
  border-radius:10px;transition:width .5s ease}

.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:18px 16px 30px}
.scroll::-webkit-scrollbar{width:0}

nav{flex-shrink:0;display:flex;background:var(--surface);
  border-top:1px solid var(--line);padding:9px 8px calc(var(--safe-bot) + 9px);
  box-shadow:0 -4px 16px -8px rgba(26,43,76,.15)}
nav button{flex:1;background:none;border:none;color:var(--ink3);
  font-family:var(--head);font-size:11px;font-weight:600;padding:8px 2px;border-radius:14px;
  display:flex;flex-direction:column;align-items:center;gap:5px;transition:.22s}
nav button .ic{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;transition:.22s}
nav button.on{color:#fff;background:var(--orange);box-shadow:0 6px 16px -6px var(--orange)}
nav button.on .ic{stroke:#fff;stroke-width:2.1;transform:scale(1.05)}

.date-strip{display:flex;gap:5px;margin-bottom:16px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px}
.date-strip::-webkit-scrollbar{height:0}
.dchip{flex:1 0 auto;min-width:34px;display:flex;flex-direction:column;align-items:center;gap:2px;
  background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 3px;
  font-family:var(--head);transition:.15s}
.dchip:active{transform:scale(.95)}
.dchip-dow{font-size:9.5px;font-weight:500;color:var(--ink3)}
.dchip-num{font-size:13px;font-weight:600;color:var(--ink)}
.dchip.today .dchip-dow{color:var(--orange)}
.dchip.on{background:var(--orange);border-color:var(--orange);box-shadow:0 4px 10px -5px var(--orange)}
.dchip.on .dchip-dow,.dchip.on .dchip-num{color:#fff}

.sec-label{font-family:var(--head);font-weight:600;font-size:13px;color:var(--ink2);
  margin:22px 4px 12px;display:flex;align-items:center;gap:7px;text-transform:uppercase;letter-spacing:.6px}
.sec-label:first-child{margin-top:2px}
.sec-label .dot{width:7px;height:7px;border-radius:2px;background:var(--orange)}
.sec-label .cnt{margin-left:auto;color:var(--ink3);font-size:11px;font-weight:500;text-transform:none;letter-spacing:0}

.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;
  padding:18px;margin-bottom:13px;box-shadow:var(--shadow);position:relative}
.card.today-card{border-left:4px solid var(--orange)}
.card.pat-card{border-left:4px solid var(--green)}

.en{font-family:var(--head);font-weight:600;font-size:19px;line-height:1.3;color:var(--ink);letter-spacing:-.2px}
.phon{color:var(--orange-d);font-size:13px;font-weight:500;margin-top:3px;font-family:var(--head)}
.mean{color:var(--ink2);font-size:15px;margin-top:6px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.ex{color:var(--ink);font-size:14.5px;line-height:1.55;margin-top:4px;white-space:pre-wrap;word-break:break-word}
.ex-kr{color:var(--ink3);font-size:13px;margin-top:2px;line-height:1.5}
.divider{height:1px;background:var(--line);margin:13px 0}

.row{display:flex;align-items:flex-start;gap:12px}
.row .body{flex:1;min-width:0}
.spk{flex-shrink:0;width:40px;height:40px;border-radius:12px;
  background:var(--surface2);border:none;color:var(--orange);
  display:flex;align-items:center;justify-content:center;transition:.15s}
.spk:active{transform:scale(.88);background:var(--orange);color:#fff}
.spk svg{width:19px;height:19px;fill:currentColor}

.pager{display:flex;justify-content:space-between;align-items:center;margin-top:14px;gap:10px}
.pager button{background:var(--surface);border:1px solid var(--line);color:var(--ink2);
  border-radius:11px;padding:10px 14px;font-family:var(--head);font-weight:500;font-size:13px;
  flex:1;transition:.15s}
.pager button:active{background:var(--surface2)}
.pager button:disabled{opacity:.4}
.pager .pos{flex:0 0 auto;color:var(--ink3);font-size:12px;min-width:54px;text-align:center;font-family:var(--head);font-weight:500}

input,textarea{width:100%;background:var(--surface2);border:1.5px solid var(--line);
  border-radius:12px;color:var(--ink);font-family:var(--body);font-size:15px;
  padding:13px;margin-bottom:10px;resize:none}
input:focus,textarea:focus{outline:none;border-color:var(--orange)}
textarea{line-height:1.6}
label{display:block;color:var(--ink2);font-size:12px;font-weight:600;margin:0 0 6px 3px;font-family:var(--head)}
.btn{background:var(--orange);color:#fff;border:none;border-radius:13px;
  font-family:var(--head);font-size:15px;font-weight:600;padding:14px;width:100%;transition:.15s}
.btn:active{transform:scale(.98);background:var(--orange-d)}
.btn.ghost{background:none;border:1.5px solid var(--line);color:var(--ink2)}
.btn-row{display:flex;gap:8px}
.add-ex{background:none;border:1.5px dashed var(--orange);color:var(--orange);
  border-radius:11px;padding:11px;width:100%;font-family:var(--head);font-weight:500;font-size:13px;margin-bottom:10px}

.del{position:absolute;top:12px;right:12px;background:none;border:none;
  color:var(--ink3);width:28px;height:28px;font-size:20px;line-height:1}
.del:active{color:#e74c3c}
.edit-btn{position:absolute;top:12px;right:46px;background:none;border:none;
  color:var(--ink3);width:28px;height:28px;line-height:1;padding:4px}
.edit-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8}
.edit-btn:active{color:var(--orange)}

.empty{text-align:center;color:var(--ink3);padding:46px 20px;font-size:14px;line-height:1.7}
.empty .ill{font-size:42px;margin-bottom:10px}
.empty .big{font-family:var(--head);font-weight:600;font-size:18px;color:var(--ink2);display:block;margin-bottom:6px}

.mind-title{font-family:var(--head);font-weight:600;font-size:18px;margin-bottom:12px;color:var(--orange)}
.mind-lead{font-family:var(--head);font-weight:700;font-size:21px;line-height:1.4;color:var(--ink);
  margin-bottom:12px;white-space:pre-wrap;word-break:break-word;letter-spacing:-.3px}
.mind-text{font-size:16px;line-height:1.9;color:var(--ink);white-space:pre-wrap;word-break:break-word}
.read-rail{position:absolute;right:5px;top:0;bottom:0;width:4px;display:none;z-index:8;pointer-events:none}
.read-rail.show{display:block}
.read-rail-fill{position:absolute;top:0;left:0;right:0;height:0;border-radius:4px;
  background:var(--ink3);opacity:.55;transition:height .08s linear}
/* Words 리스트 */
.vocab-card{margin-bottom:10px;padding:14px}
.voc-head{display:flex;align-items:center;gap:11px}
.voc-toggle{flex:0 0 auto;width:30px;height:30px;border-radius:9px;border:1px solid var(--line);
  background:var(--surface2);color:var(--orange);font-family:var(--head);font-size:19px;font-weight:600;
  line-height:1;display:flex;align-items:center;justify-content:center}
.voc-toggle:active{background:var(--orange);color:#fff}
.voc-word{flex:1;min-width:0}
.voc-word .en{font-size:18px}
.voc-head .spk{flex:0 0 auto}
.voc-body{margin-top:4px}
.field{display:flex;gap:9px;margin-top:10px}
.field .flabel{flex:0 0 auto;width:38px;font-family:var(--head);font-weight:600;font-size:11px;
  color:var(--ink3);background:var(--surface2);border-radius:6px;padding:3px 0;text-align:center;height:fit-content}
.field .mean,.field .ex{flex:1;margin-top:1px}
.syn-inline{flex:1;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.syn-chip{display:inline-flex;align-items:baseline;gap:4px;background:var(--surface2);
  border-radius:8px;padding:4px 9px;font-family:var(--head);font-weight:600;font-size:13px;color:var(--ink)}
.syn-chip i{font-style:normal;font-weight:400;font-size:11px;color:var(--ink3)}
.syn-mini{background:none;border:1px solid var(--line);color:var(--ink3);border-radius:7px;
  width:26px;height:26px;font-size:13px}
.syn-mini-btn{background:none;border:1px dashed var(--orange);color:var(--orange);
  border-radius:8px;padding:5px 11px;font-family:var(--head);font-weight:600;font-size:12px}
.syn-mini-btn:disabled{opacity:.6}
.syn-wait{font-size:12px;color:var(--ink3);font-style:italic}
.voc-actions{display:flex;gap:8px;margin-top:14px}
.voc-act{flex:1;background:var(--surface2);border:none;color:var(--ink2);border-radius:9px;
  padding:9px;font-family:var(--head);font-weight:500;font-size:13px}
.voc-act:active{background:var(--line)}
.voc-act.del-act{color:#e74c3c}
.mind-card{margin-bottom:16px}
.mind-pick{transition:.15s}
.mind-pick:active{transform:scale(.99);background:var(--surface2)}
.mind-num{display:inline-block;font-family:var(--head);font-weight:700;font-size:13px;
  color:var(--ink3);background:var(--surface2);border-radius:8px;padding:3px 10px;margin-bottom:12px}

.page-title{font-family:var(--head);font-weight:700;font-size:24px;margin-bottom:6px;letter-spacing:-.4px}
.page-sub{color:var(--ink3);font-size:13px;margin-bottom:16px}

.toast{position:fixed;left:50%;bottom:calc(var(--safe-bot) + 82px);
  transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;
  padding:12px 22px;border-radius:30px;font-size:14px;font-weight:500;
  opacity:0;transition:.3s;pointer-events:none;z-index:99;box-shadow:var(--shadow)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.plusone{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
  font-family:var(--head);font-weight:700;font-size:90px;color:var(--orange);
  pointer-events:none;z-index:120;opacity:0;text-shadow:0 4px 20px rgba(255,140,0,.4)}
.plusone.go{animation:p1 1s cubic-bezier(.2,.8,.3,1) forwards}
@keyframes p1{
  0%{opacity:0;transform:translate(-50%,-30%) scale(.5)}
  30%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}
  60%{opacity:1;transform:translate(-50%,-58%) scale(1)}
  100%{opacity:0;transform:translate(-50%,-95%) scale(.9)}
}

.loading{text-align:center;padding:54px 20px;color:var(--ink3)}
.spin{width:32px;height:32px;border:3px solid var(--line);border-top-color:var(--orange);
  border-radius:50%;animation:sp 1s linear infinite;margin:0 auto 14px}
@keyframes sp{to{transform:rotate(360deg)}}

.modal-bg{position:fixed;inset:0;background:rgba(10,18,38,.55);z-index:50;display:none;
  align-items:flex-end;backdrop-filter:blur(3px)}
.modal-bg.show{display:flex}
.modal{background:var(--bg);width:100%;border-radius:24px 24px 0 0;padding:24px 18px;
  padding-bottom:calc(var(--safe-bot) + 22px);max-height:90%;overflow-y:auto;animation:up .25s ease}
@keyframes up{from{transform:translateY(100%)}}
.complete-btn{background:var(--green);margin-top:4px}
.complete-btn:active{background:#27ae60}
.done-badge{display:inline-flex;align-items:center;gap:5px;background:var(--green);color:#fff;
  font-family:var(--head);font-weight:600;font-size:12px;padding:7px 14px;border-radius:30px;margin-top:6px}

/* help */
.help-step{display:flex;gap:13px;margin-bottom:16px}
.help-num{flex-shrink:0;width:28px;height:28px;border-radius:50%;background:var(--orange);
  color:#fff;font-family:var(--head);font-weight:700;font-size:14px;
  display:flex;align-items:center;justify-content:center}
.help-body{flex:1;min-width:0}
.help-body b{font-family:var(--head);font-weight:600;font-size:15px;color:var(--ink);display:block;margin-bottom:3px}
.help-body p{color:var(--ink2);font-size:13.5px;line-height:1.6}
.help-sec{font-family:var(--head);font-weight:600;font-size:13px;color:var(--orange);
  margin:22px 0 14px;text-transform:uppercase;letter-spacing:.6px}
.help-sec:first-of-type{margin-top:10px}
.help-note{background:var(--surface2);border-radius:12px;padding:13px;font-size:13px;
  line-height:1.65;color:var(--ink2);margin-top:6px}
kbd{font-family:var(--head);font-weight:600;background:var(--surface);border:1px solid var(--line);
  border-radius:6px;padding:1px 6px;font-size:12px;color:var(--ink)}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand-row">
      <div class="brand">
        <img class="logo" src="logo.png" alt="logo"
             onerror="this.outerHTML='<svg class=\'logo\' viewBox=\'0 0 40 40\' fill=\'none\'><rect x=\'1\' y=\'1\' width=\'38\' height=\'38\' rx=\'11\' fill=\'#FF8C00\'/><path d=\'M14 28V15.5c0-.6.7-.9 1.2-.5l3.3 2.6\' stroke=\'#fff\' stroke-width=\'2.6\' stroke-linecap=\'round\' stroke-linejoin=\'round\'/><path d=\'M22 24l4-4 4 4M26 20v9\' stroke=\'#fff\' stroke-width=\'2.6\' stroke-linecap=\'round\' stroke-linejoin=\'round\'/></svg>'">
        <div class="brand-txt">
          <div class="name">One More English</div>
          <div class="slogan">Learn one more thing, every day</div>
        </div>
      </div>
      <div class="top-actions">
        <div class="streak" id="streak"><span class="fire">🔥</span><span id="streakN">0</span></div>
        <button class="icon-btn" onclick="toggleTheme()" id="themeBtn">
          <svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>
        </button>
      </div>
    </div>
    <div class="date-line" id="dateLine">
      <div class="date-big" id="hDate">—</div>
      <div class="date-sub" id="hSub"></div>
    </div>
  </header>
  <div class="scroll" id="view"></div>
  <button class="fab-float" id="fabFloat" onclick="fabAdd()" aria-label="추가">+</button>
  <div class="read-rail" id="readRail"><div class="read-rail-fill" id="readRailFill"></div></div>
  <nav id="nav"></nav>
</div>

<div class="modal-bg" id="modalBg"><div class="modal" id="modalBody"></div></div>
<div class="toast" id="toast"></div>
<div class="plusone" id="plusone">+1</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, onValue, set as fbSet } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
const firebaseConfig = {
  apiKey: "AIzaSyAD2vybcyHC5uqmkrVg47hSd6IEXoqPlHU",
  authDomain: "english39-724d2.firebaseapp.com",
  databaseURL: "https://english39-724d2-default-rtdb.firebaseio.com",
  projectId: "english39-724d2",
  storageBucket: "english39-724d2.firebasestorage.app",
  messagingSenderId: "438613984702",
  appId: "1:438613984702:web:8bcee87179906f6b0ba5ef"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
// 메인 스크립트가 쓸 수 있도록 전역에 노출
window.OMEcloud = {
  // 한 컬렉션(patterns/vocab/mind) 실시간 구독
  watch(key, cb){ onValue(ref(db, 'omeData/'+key), snap => cb(snap.val()||[])); },
  // 한 컬렉션 통째로 저장
  save(key, list){ return fbSet(ref(db, 'omeData/'+key), list); }
};
window.dispatchEvent(new Event('ome-cloud-ready'));
</script>

<script>
const DB={
  get(k,d){try{const v=localStorage.getItem('ome_'+k);return v===null?d:JSON.parse(v)}catch{return d}},
  set(k,v){localStorage.setItem('ome_'+k,JSON.stringify(v))}
};

/* ===== 클라우드(Firebase) 동기화: patterns·vocab·mind ===== */
const CLOUD_KEYS=['patterns','vocab','mind'];
const cloudCache={patterns:null,vocab:null,mind:null}; // null=아직 안 받음
let cloudReady=false;

// 클라우드 키는 cloudCache에서 읽고, 그 외(theme/streak/days 등)는 localStorage
function listGet(k){
  if(CLOUD_KEYS.includes(k)) return cloudCache[k]||[];
  return DB.get(k,[]);
}
function listSet(k,v){
  if(CLOUD_KEYS.includes(k)){
    cloudCache[k]=v;
    DB.set(k,v); // 오프라인 대비 로컬에도 보관
    if(window.OMEcloud){ window.OMEcloud.save(k,v).catch(()=>toast('동기화 실패 — 인터넷 확인')); }
    return;
  }
  DB.set(k,v);
}
function startCloud(){
  if(!window.OMEcloud)return;
  CLOUD_KEYS.forEach(k=>{
    // 첫 연결 시 로컬값으로 미리 채워 화면이 비지 않게
    if(cloudCache[k]===null) cloudCache[k]=DB.get(k,[]);
    window.OMEcloud.watch(k,(val)=>{
      cloudCache[k]=Array.isArray(val)?val:[];
      DB.set(k,cloudCache[k]);
      cloudReady=true;
      if(TAB!=='today') render(); // 다른 기기 변경이 들어오면 자동 갱신
      else setHeader();
    });
  });
}
// startCloud 실제 호출은 스크립트 맨 끝(모든 변수 선언 후)에서 수행
const todayKey=(d=new Date())=>{
  const z=new Date(d.getTime()-d.getTimezoneOffset()*60000);
  return z.toISOString().slice(0,10);
};
function fmtDate(key){
  const [y,m,dd]=key.split('-').map(Number);
  const dt=new Date(y,m-1,dd);
  const days=['일','월','화','수','목','금','토'];
  return {big:`${m}월 ${dd}일`, sub:`${days[dt.getDay()]}요일 · ${y}`};
}

function applyTheme(){
  const t=DB.get('theme','light');
  document.documentElement.setAttribute('data-theme',t);
  document.querySelector('meta[name=theme-color]').setAttribute('content', t==='dark'?'#0e1830':'#1A2B4C');
}
function toggleTheme(){
  DB.set('theme', DB.get('theme','light')==='dark'?'light':'dark');
  applyTheme();
}

function bumpStreak(){
  const last=DB.get('streakDate',null);
  const tk=todayKey();
  if(last===tk)return;
  const y=todayKey(new Date(Date.now()-86400000));
  let n=DB.get('streakN',0);
  n = (last===y)? n+1 : 1;
  DB.set('streakN',n); DB.set('streakDate',tk);
  renderStreak();
}
function renderStreak(){
  const last=DB.get('streakDate',null), tk=todayKey();
  const y=todayKey(new Date(Date.now()-86400000));
  let n=DB.get('streakN',0);
  if(last && last!==tk && last!==y)n=0;
  document.getElementById('streakN').textContent=n;
}

let voices=[];
let ttsUnlocked=false;
function loadVoices(){ try{voices=speechSynthesis.getVoices()||[]}catch{} }
if('speechSynthesis'in window){
  loadVoices();
  speechSynthesis.onvoiceschanged=loadVoices;
}
function speak(text){
  if(!('speechSynthesis'in window)){toast('이 기기는 음성을 지원하지 않아요');return}
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang='en-US'; u.rate=.9; u.pitch=1; u.volume=1;
    if(!voices.length) loadVoices();
    const en=voices.filter(v=>v.lang&&v.lang.toLowerCase().startsWith('en'));
    if(en.length){
      u.voice = en.find(v=>/google|samantha|natural/i.test(v.name)) || en[0];
    }
    speechSynthesis.speak(u);
    ttsUnlocked=true;
  }catch(e){ toast('소리 재생에 실패했어요'); }
}
// 줄바꿈·따옴표가 있어도 안전하게 스피커 버튼을 만든다 (base64로 인코딩)
function spkBtn(text){
  const enc=btoa(unescape(encodeURIComponent(text||'')));
  return `<button class="spk" data-speak="${enc}">${spkSVG}</button>`;
}

function plusOne(){
  const el=document.getElementById('plusone');

}

}

async function getDayContent(key){
  const cache=DB.get('days',{});
  if(cache[key])return cache[key];
  if(key>todayKey())return null;
  return await fetchDay(key,cache);
}
async function fetchDay(key,cache){
  const view=document.getElementById('view');
  view.innerHTML='<div class="loading"><div class="spin"></div>오늘의 한 가지를 불러오고 있어요…</div>';
  try{
    // GitHub Actions가 매일 만들어 두는 정적 JSON
    const res=await fetch(`content/${key}.json?t=${Date.now()}`,{cache:'no-store'});
    if(!res.ok)throw new Error('not found');
    const day=await res.json();
    cache[key]=day; DB.set('days',cache);
    return day;
  }catch(e){
    view.innerHTML='<div class="empty"><div class="ill">🌙</div><span class="big">아직 준비되지 않았어요</span>오늘의 콘텐츠는 매일 새벽에<br>자동으로 만들어집니다.<br>잠시 후 다시 열어주세요.<br><br><button class="btn" onclick="render()" style="max-width:200px;margin:10px auto 0">새로고침</button></div>';
    return 'ERR';
  }
}

// 최근 7일 가로 날짜 띠
function dateStrip(){
  const days=['일','월','화','수','목','금','토'];
  const tk=todayKey();
  let chips='';
  for(let off=6; off>=0; off--){
    const d=new Date(); d.setDate(d.getDate()-off);
    const key=todayKey(d);
    const isToday=key===tk;
    const isCur=key===dayView;
    chips+=`<button class="dchip ${isCur?'on':''} ${isToday?'today':''}" onclick="pickDay('${key}')">
      <span class="dchip-dow">${isToday?'오늘':days[d.getDay()]}</span>
      <span class="dchip-num">${d.getDate()}</span>
    </button>`;
  }
  return `<div class="date-strip" id="dateStrip">${chips}</div>`;
}
function pickDay(key){ dayView=key; render(); }
function moveDay(dir){
  const cache=DB.get('days',{});
  const keys=Object.keys(cache).sort();
  if(!keys.includes(todayKey()))keys.push(todayKey());
  keys.sort();
  let i=keys.indexOf(dayView)+dir;
  if(i<0)i=0; if(i>keys.length-1)i=keys.length-1;
  dayView=keys[i]; render();
}

function savePattern(editIdx){
  const pat=val('f_pat'); if(!pat){toast('패턴을 입력하세요');return}
  const ex=val('f_ex').split('\n').map(e=>e.trim()).filter(Boolean);
  const list=listGet('patterns').slice();
  const item={pattern:pat,meaning:val('f_mean'),examples:ex.length?ex:['']};
  if(editIdx!=null){ list[editIdx]=item; pIdx=editIdx; }
  else { list.push(item); pIdx=list.length-1; plusOne(); }
  listSet('patterns',list); closeModal(); render(); toast(editIdx!=null?'수정됐어요':'저장됐어요');
}

// 유의어: 단어 옆 작은 칩 (직접 입력)
function synInline(w,idx){
  if(Array.isArray(w.synonyms)&&w.synonyms.length){
    return w.synonyms.map(s=>`<span class="syn-chip">${esc(s.word||'')}${s.meaning?`<i>${esc(s.meaning)}</i>`:''}</span>`).join('');
  }
  return `<span class="syn-wait">없음</span>`;
}
function openVocabForm(editIdx){
  const editing=editIdx!=null;
  const w=editing? listGet('vocab')[editIdx] : null;
  document.getElementById('modalBody').innerHTML=`<div class="page-title">${editing?'단어 수정':'단어 추가'}</div>
    <div style="margin-top:14px"></div>
    <label>단어 (영어)</label><input id="v_w" placeholder="예: resilient" value="${editing?esc(w.word):''}">
    <label>발음기호 (선택)</label><input id="v_p" placeholder="예: /rɪˈzɪliənt/" value="${editing&&w.phonetic?esc(w.phonetic):''}">
    <label>의미</label><textarea id="v_m" rows="2" placeholder="예: 회복력 있는">${editing&&w.meaning?esc(w.meaning):''}</textarea>
    <label>예문 (선택)</label><textarea id="v_e" rows="2" placeholder="예문">${editing&&w.example?esc(w.example):''}</textarea>
    <label>유의어 (선택, 쉼표 또는 줄바꿈으로 구분)</label>
    <textarea id="v_s" rows="2" placeholder="예: strong, tough, sturdy">${editing&&Array.isArray(w.synonyms)?esc(w.synonyms.map(s=>s.meaning?`${s.word}:${s.meaning}`:s.word).join(', ')):''}</textarea>
    <div class="btn-row"><button class="btn ghost" onclick="closeModal()">취소</button>
    <button class="btn" onclick="saveVocab(${editing?editIdx:'null'})">저장</button></div>`;
  showModal();
}
function parseSynonyms(raw){
  return raw.split(/[,\n]/).map(s=>s.trim()).filter(Boolean).map(s=>{
    const m=s.split(':');
    return m.length>1 ? {word:m[0].trim(), meaning:m.slice(1).join(':').trim()} : {word:s, meaning:''};
  });
}
function saveVocab(editIdx){
  const w=val('v_w'); if(!w){toast('단어를 입력하세요');return}
  const list=listGet('vocab').slice();
  const syn=parseSynonyms(val('v_s'));
  const item={word:w,phonetic:val('v_p'),meaning:val('v_m'),example:val('v_e'),synonyms:syn};
  if(editIdx!=null){ list[editIdx]=item; vIdx=editIdx; }
  else { list.push(item); vIdx=list.length-1; plusOne(); }
  listSet('vocab',list); closeModal(); render(); toast(editIdx!=null?'수정됐어요':'저장됐어요');
}

    <label>내용 (붙여넣기)</label>
    <textarea id="m_x" rows="11" placeholder="글을 붙여넣으세요. 첫 줄이 제목처럼 크게 표시됩니다.">${editing?esc(it.text):''}</textarea>
    <div class="btn-row"><button class="btn ghost" onclick="closeModal()">취소</button>
    <button class="btn" onclick="saveMind(${editing?editIdx:'null'})">저장</button></div>`;
  showModal();
}
function saveMind(editIdx){
  const x=val('m_x'); if(!x){toast('내용을 입력하세요');return}
  const list=listGet('mind').slice();
  const item={text:x};
  if(editIdx!=null){ list[editIdx]=item; mIdx=editIdx; }
  else { list.push(item); mIdx=list.length-1; plusOne(); }
  listSet('mind',list); closeModal(); render(); toast(editIdx!=null?'수정됐어요':'저장됐어요');
}

function delItem(key,i){
  if(!confirm('삭제할까요?'))return;
  const list=listGet(key).slice(); list.splice(i,1); listSet(key,list);
  const last=Math.max(0,list.length-1);
  if(key==='patterns')pIdx=Math.min(pIdx,last);
  if(key==='vocab')vIdx=Math.min(vIdx,last);
  if(key==='mind')mIdx=Math.min(mIdx,last);
  render();
}
function val(id){return document.getElementById(id).value.trim()}
function esc(s){return(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function q(s){return JSON.stringify(s)}
function showModal(){document.getElementById('modalBg').classList.add('show')}
function closeModal(){document.getElementById('modalBg').classList.remove('show')}

function openJump(){
  const m=document.getElementById('modalBody');
  if(TAB==='today'){
    const cache=DB.get('days',{});
    let keys=Object.keys(cache).sort();
    if(!keys.includes(todayKey()))keys.push(todayKey());
    keys.sort();
    let h=`<div class="page-title">날짜 선택</div><div class="page-sub">지난 날짜의 학습을 다시 볼 수 있어요</div><div class="jump-list">`;
    // 최신 날짜가 위로
    keys.slice().reverse().forEach(k=>{
      const f=fmtDate(k);
      h+=`<button class="jump-item ${k===dayView?'cur':''}" onclick="jumpTo('${k}')">
        <span class="jnum">${k===todayKey()?'오늘':'📅'}</span>
        <span class="jbody"><b>${f.big}</b> · ${f.sub}</span></button>`;
    });
    h+='</div>';
    m.innerHTML=h; showModal(); return;
  }
  const map={pattern:['Phrases','patterns'],vocab:['Words','vocab'],mind:['Mindset','mind']};
  const [title,key]=map[TAB];
  const list=listGet(key);
  let h=`<div class="page-title">${title} 목록</div><div class="page-sub">전체 ${list.length}개 · 원하는 항목으로 이동</div><div class="jump-list">`;
  list.forEach((it,i)=>{
    let label = key==='patterns'? it.pattern : key==='vocab'? it.word : (it.title||it.text);
    label = (label||'').slice(0,40);
    const cur = (key==='patterns'&&i===pIdx)||(key==='vocab'&&i===vIdx)||(key==='mind'&&i===mIdx);
    h+=`<button class="jump-item ${cur?'cur':''}" onclick="jumpItem('${key}',${i})">
      <span class="jnum">${i+1}</span><span class="jbody">${esc(label)}</span></button>`;
  });
  h+='</div>';
  m.innerHTML=h; showModal();
}
function jumpTo(k){dayView=k; closeModal(); render()}
function jumpItem(key,i){
  if(key==='patterns')pIdx=i; if(key==='vocab')vIdx=i; if(key==='mind')mIdx=i;
  closeModal(); render();
}
document.getElementById('modalBg').onclick=e=>{if(e.target.id==='modalBg')closeModal()};

let tsX=0,tsY=0;
const sc=document.getElementById('view');
// 스피커 버튼: 이벤트 위임으로 안전하게 재생 (줄바꿈/따옴표 영향 없음)
sc.addEventListener('click',e=>{
  const btn=e.target.closest('.spk');
  if(!btn)return;
  try{ speak(decodeURIComponent(escape(atob(btn.getAttribute('data-speak')||'')))); }catch{ }
});
sc.addEventListener('touchstart',e=>{tsX=e.touches[0].clientX;tsY=e.touches[0].clientY},{passive:true});
// 읽기 위치 진행 막대 (Mindset 탭에서만)
function updateReadRail(){
  const rail=document.getElementById('readRail'), fill=document.getElementById('readRailFill');
  if(TAB!=='mind'&&TAB!=='vocab'){ rail.classList.remove('show'); return; }
  const max=sc.scrollHeight - sc.clientHeight;
  if(max<=8){ rail.classList.remove('show'); return; } // 짧으면 숨김
  // 헤더(상단 네이비) 끝나는 지점부터 막대 시작
  const header=document.querySelector('header');
  rail.style.top = (header? header.offsetHeight : 0) + 'px';
  rail.style.bottom = '0px';
  rail.classList.add('show');
  const pct=Math.min(100, Math.max(0, sc.scrollTop/max*100));
  fill.style.height=pct+'%';
}
sc.addEventListener('scroll', updateReadRail, {passive:true});
sc.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tsX, dy=e.changedTouches[0].clientY-tsY;
  if(Math.abs(dx)<60||Math.abs(dx)<Math.abs(dy)*1.4)return;
  if(TAB==='today')moveDay(dx<0?1:-1);
  else if(TAB==='pattern'){const n=listGet('patterns').length; pIdx=Math.max(0,Math.min(n-1,pIdx+(dx<0?1:-1)));render()}
  // vocab·mind는 세로 스크롤 방식이라 좌우 스와이프 없음
  // mind는 세로 스크롤 방식이라 좌우 스와이프 없음
});

function renderNav(){
  const tabs=[['today','Today',ICON.today],['pattern','Phrases',ICON.pattern],
    ['vocab','Words',ICON.vocab],['mind','Mindset',ICON.mind]];
  document.getElementById('nav').innerHTML=tabs.map(([id,name,ic])=>
    `<button class="${TAB===id?'on':''}" onclick="switchTab('${id}')">
      <svg class="ic" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">${ic}</svg>${name}</button>`).join('');
}
function switchTab(t){TAB=t; if(t==='today')dayView=todayKey(); render()}
// 플로팅 추가 버튼: 현재 탭에 맞는 폼 열기
function fabAdd(){
  if(TAB==='pattern')openPatternForm();
  else if(TAB==='vocab')openVocabForm();
  else if(TAB==='mind')openMindForm();
}
function updateFab(){
  const b=document.getElementById('fabFloat');
  if(!b)return;
  // Today에는 추가 버튼 없음
  b.classList.toggle('show', TAB==='pattern'||TAB==='vocab'||TAB==='mind');
}

render();
// 모든 변수·함수 선언 후 클라우드 동기화 시작
if(window.OMEcloud) startCloud();
else window.addEventListener('ome-cloud-ready', startCloud, {once:true});
if('serviceWorker'in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{})}
</script>
</body>
</html>
